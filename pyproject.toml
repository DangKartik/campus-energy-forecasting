[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-energy"
version = "1.0.0"
description = "Hourly campus building energy forecasting with a structural Ridge model and context-aware imputation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kartik Dang" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["campus_energy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
